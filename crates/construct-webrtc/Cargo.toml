[package]
name = "construct-webrtc"
description = "Spike: FFI to a pinned libwebrtc prebuilt (webrtc-sdk line). First guard: post-quantum DTLS markers in the binary."
license = "MPL-2.0"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false

# No runtime dependencies yet: the first step is a guard test that reads the pinned
# prebuilt and fails if it loses the PQ-DTLS field trial or the X25519MLKEM768 group
# (construct-docs decisions/calls-post-quantum-dtls.md). The C++ FFI bindings come next.
[build-dependencies]
sha2 = "0.10"
cc = "1"
