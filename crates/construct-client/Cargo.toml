[package]
name = "construct-client"
description = "The Konstruct client layer: account, keys, contacts, the message stream and the core's Orchestrator — no front end"
license = "MPL-2.0"
version = "0.2.0"
edition = "2024"
rust-version = "1.96"
repository = "https://github.com/konstruct-msg/construct-tui"

[features]
default = ["post-quantum"]
post-quantum = ["construct-core/post-quantum"]
# Recording voice notes (`voice`): the microphone and Fraunhofer's AAC encoder (C++, built here).
# Off unless a shell records.
voice = ["dep:cpal", "dep:fdk-aac"]

# No front-end dependency belongs here — no ratatui, no crossterm, no windowing toolkit.
# `tests::the_client_crate_depends_on_no_front_end` reads this file and fails on one.
[dependencies]
# VEIL (veil-front) in this process: the coordinator, its pinned TLS to the front, AUTH v2/v3.
# Pinned by commit, as construct-core pins it.
construct-veil = { git = "https://github.com/konstruct-msg/construct-veil", rev = "ba2bd355a3b24acd330786d7bb82442c224f9218", features = ["coordinator"] }
construct-veil-protocol = { git = "https://github.com/konstruct-msg/construct-veil", rev = "ba2bd355a3b24acd330786d7bb82442c224f9218" }
# Crypto (Orchestrator). Production public host (ams.konstruct.cc) is HTTP/2; QUIC/H3 is
# quic.konstruct.cc with a pinned gateway cert (iOS construct-transport), not this client.
construct-core = { path = "../../../construct-core", features = ["store"] }

# gRPC over HTTP/2
h2 = "0.4"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rustls = { version = "0.23", features = ["ring"] }
rustls-native-certs = "0.7"
webpki-roots = "0.26"
bytes = "1"
cpal = { version = "0.18", optional = true }
fdk-aac = { version = "0.8", optional = true }
http = "1"
prost = "0.13"

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "fs"] }
tokio-stream = "0.1"
async-stream = "0.3"
futures = "0.3"

# Errors, config, storage
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_bytes = "0.11"
dirs = "5"
# The local store: one schema for every client, SQLCipher-encrypted whole
# (decisions/local-store-in-the-core.md). The platform keeps only its key.
construct-store = { path = "../../../construct-core/store" }

# Session encryption at rest, key derivation, signatures
argon2 = { version = "0.5", features = ["std"] }
aes-gcm = "0.10"
zeroize = { version = "1", features = ["std"] }
hkdf = "0.12"
sha2 = "0.10"
hmac = "0.12"
rand = "0.8"
hex = "0.4"
ed25519-dalek = { version = "2.0", features = ["std", "rand_core"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
signature = "2"
base64 = "0.22.1"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"

# History over the local network: the name iOS browses for (Bonjour), in Rust, no system daemon.
mdns-sd = "0.21"

# The store key in the OS key store: Keychain, Secret Service, Credential Manager.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust", "vendored"] }
# Linux has no system crypto SQLCipher can use.
construct-store = { path = "../../../construct-core/store", features = ["vendored-openssl"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
construct-store = { path = "../../../construct-core/store", features = ["vendored-openssl"] }

[build-dependencies]
prost-build = "0.13"

[dev-dependencies]
# Opens a sealed intake tag as the server does (`privacy_pass::open_sealed_token_bytes`).
chacha20poly1305 = "0.10"
rcgen = "0.13"
# Voice notes read back by independent parsers: an MP4 reader and a decoder.
mp4 = "0.14"
symphonia = { version = "0.6", default-features = false, features = ["aac", "isomp4"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
