[package]
name = "construct-client"
description = "The Konstruct client layer: account, keys, contacts, the message stream and the core's Orchestrator — no front end"
license = "MPL-2.0"
version = "0.2.0"
edition = "2024"
rust-version = "1.96"
repository = "https://github.com/konstruct-msg/construct-tui"

[features]
default = ["post-quantum"]
post-quantum = ["construct-core/post-quantum"]

# No front-end dependency belongs here — no ratatui, no crossterm, no windowing toolkit.
# `tests::the_client_crate_depends_on_no_front_end` reads this file and fails on one.
[dependencies]
# Crypto (Orchestrator). Production public host (ams.konstruct.cc) is HTTP/2; QUIC/H3 is
# quic.konstruct.cc with a pinned gateway cert (iOS construct-transport), not this client.
construct-core = { path = "../../../construct-core" }

# gRPC over HTTP/2
h2 = "0.4"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rustls = { version = "0.23", features = ["ring"] }
rustls-native-certs = "0.7"
webpki-roots = "0.26"
bytes = "1"
http = "1"
prost = "0.13"

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util"] }
tokio-stream = "0.1"
async-stream = "0.3"
futures = "0.3"

# Errors, config, storage
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_bytes = "0.11"
dirs = "5"
rusqlite = { version = "0.31", features = ["bundled-sqlcipher"] }

# Session encryption at rest, key derivation, signatures
argon2 = { version = "0.5", features = ["std"] }
aes-gcm = "0.10"
zeroize = { version = "1", features = ["std"] }
hkdf = "0.12"
sha2 = "0.10"
rand = "0.8"
hex = "0.4"
ed25519-dalek = { version = "2.0", features = ["std", "rand_core"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
signature = "2"
base64 = "0.22.1"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"

[build-dependencies]
prost-build = "0.13"
